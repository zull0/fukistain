<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fukistain</title>
<style>
:root{--bg:#eef2ff;--bg2:#d6daf0;--text:#000;--link:#34345c;--hover:#dd0000;--name:#117743;--subj:#0f0c5d;--green:#789922;--bar:#98e;--border:#b7c5d9;--reply:#d6daf0;--op:transparent;--title:#af0a0f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1f21;--bg2:#282a2e;--text:#c5c8c6;--link:#81a2be;--hover:#e04000;--name:#8abeb7;--subj:#cc6666;--green:#b5bd68;--bar:#373b41;--border:#373b41;--reply:#282a2e;--title:#cc6666}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1d1f21;--bg2:#282a2e;--text:#c5c8c6;--link:#81a2be;--hover:#e04000;--name:#8abeb7;--subj:#cc6666;--green:#b5bd68;--bar:#373b41;--border:#373b41;--reply:#282a2e;--title:#cc6666}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 Arial,Helvetica,sans-serif;padding:0 8px 40px}
a{color:var(--link);text-decoration:none}a:hover{color:var(--hover)}
.nav{font-size:11px;padding:3px 0;border-bottom:1px solid var(--border);margin:0 -8px 0;padding-left:8px}
.nav a{margin:0 1px}.nav .r{float:right;padding-right:8px;cursor:pointer;color:var(--link)}
.logo{text-align:center;margin:18px 0 4px}
.logo h1{margin:0;font:700 42px/1 Tahoma,Verdana,Arial,sans-serif;letter-spacing:-2px;color:var(--title)}
.logo p{margin:4px 0 0;font-size:13px;font-weight:700;color:var(--subj)}
hr{border:0;border-top:1px solid var(--border);margin:8px 0}
.formwrap{text-align:center}
.formwrap>a.tog{font-size:20px;font-weight:700;color:var(--title);cursor:pointer}
form.post{display:none;margin:8px auto;border-collapse:collapse;text-align:left;width:min(100%,520px)}
form.post.open{display:block}
form.post label{display:flex;margin:1px 0}
form.post label span{background:var(--bar);color:var(--text);font-weight:700;width:90px;padding:4px 6px;flex:none;border:1px solid var(--border)}
form.post input[type=text],form.post input[type=password],form.post textarea{flex:1;min-width:0;font:13px Arial,sans-serif;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:3px}
form.post textarea{height:90px;resize:vertical}
form.post .row{display:flex;gap:8px;align-items:center;margin-top:4px}
form.post button{font:13px Arial;padding:2px 10px}
.err{color:var(--hover);font-size:12px}
.thread{clear:both;margin-bottom:6px}
.post{overflow:hidden}
.post.reply{display:table;background:var(--reply);border:1px solid var(--border);border-left:0;border-top:0;margin:2px 0 2px 4px;padding:2px;max-width:calc(100% - 12px)}
.info{margin-bottom:2px}.info .nm{color:var(--name);font-weight:700}.info .sj{color:var(--subj);font-weight:700}
.info .no a{color:var(--text)}.info .no a:hover{color:var(--hover)}
.post img.th{float:left;margin:3px 20px 5px 20px;max-width:200px;max-height:200px;border:0;cursor:zoom-in}
.post img.th.big{max-width:100%;max-height:none;float:none;display:block;cursor:zoom-out}
.msg{margin:10px 40px 10px 40px;white-space:pre-wrap;word-wrap:break-word}
.reply .msg{margin:6px 20px}
.msg .gt{color:var(--green)}.msg a.ql{color:var(--hover);text-decoration:underline}
.omit{color:#707070;margin:4px 0 4px 20px;font-size:12px}
.crumb{font-weight:700;margin:6px 0}
.pages{border:1px solid var(--border);display:inline-block;padding:2px 6px;background:var(--reply);margin:8px 0}
.boards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}
.bcard{border:1px solid var(--border);background:var(--reply);width:230px;padding:8px}
.bcard b{display:block;color:var(--title);font-size:15px}
.adm{color:var(--hover);font-weight:700}.del{color:var(--hover);cursor:pointer;font-size:11px}.lg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20}.lg .box{background:var(--bg);border:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:6px;width:min(90%,300px)}.lg input{font:13px Arial,sans-serif;padding:4px;background:var(--bg);color:var(--text);border:1px solid var(--border)}.lg .row{display:flex;gap:6px}
.foot{text-align:center;font-size:11px;color:#707070;margin-top:30px}
@media (max-width:600px){.msg{margin:8px 12px}.post img.th{margin:3px 10px 5px}}
</style>
</head>
<body>
<div class="nav" id="nav"></div>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var BOARDS={b:["Random","Anything goes."],m:["Music","Albums, gear, listening"],lit:["Literature","Books, writing, poetry"],mc:["Politically Incorrect","Unfiltered discussion"],g:["Religion & Theological","Faith, scripture, philosophy"],gay:["Fitness","Training, nutrition, progress"],edu:["Education","Study help, schools, learning"]};
var SUPABASE_URL="https://xzbrcxeqwzzkvfatpqgs.supabase.co",SUPABASE_KEY="sb_publishable_yi9xjaYIBDGbgBbIpb1EPA_ZZpY2AfF";
var D,ADM=false,NOTE="Anonymous board. Be civil.",SB,ME,TS=[],RS=[];
function isAdm(){return ADM}
function load(){if(!D)rebuild([],[])}
function rebuild(T,R){D={};Object.keys(BOARDS).forEach(function(k){D[k]=[]});var by={};T.forEach(function(t){t.text=t.body;t.time=Date.parse(t.created_at);t.r=[];t.bump=t.time;by[t.id]=t;if(D[t.board])D[t.board].push(t)});R.forEach(function(r){r.text=r.body;r.time=Date.parse(r.created_at)});R.slice().sort(function(a,b){return a.time-b.time}).forEach(function(r){var t=by[r.thread_id];if(t){t.r.push(r);t.bump=Math.max(t.bump,r.time)}})}
function refresh(){var t=document.getElementById("fc");if(t&&(t.value||document.activeElement==t))return;var y=scrollY;route();scrollTo(0,y)}
async function pull(){if(!ME)return;var a=await SB.from("threads").select("*"),b=await SB.from("replies").select("*");if(a.error||b.error)return;TS=a.data;RS=b.data;rebuild(TS,RS);refresh()}
function err(m){var e=document.querySelector(".err");if(e)e.textContent=m}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(s){return esc(s).split("\n").map(function(l){l=l.replace(/&gt;&gt;(\d+)/g,function(m,n){return'<a class="ql" href="#/'+cur.b+"/"+findT(+n)+"/"+n+'">&gt;&gt;'+n+"</a>"});return /^&gt;(?!&gt;\d)/.test(l)?'<span class="gt">'+l+"</span>":l}).join("\n")}
function findT(n){var L=D[cur.b]||[];for(var i=0;i<L.length;i++){if(L[i].id==n)return L[i].id;for(var j=0;j<L[i].r.length;j++)if(L[i].r[j].id==n)return L[i].id}return 0}
function dt(t){var d=new Date(t),p=function(n){return(n<10?"0":"")+n};return p(d.getMonth()+1)+"/"+p(d.getDate())+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())}
var cur={b:"",t:0,hl:0};
function nav(){var h='[';h+=Object.keys(BOARDS).map(function(k){return'<a href="#/'+k+'">'+k+"</a>"}).join(" / ")+'] [<a href="#/">Home</a>] '+(isAdm()?"[Admin mode] [<a href=\"#\" id=\"lo\">Log out</a>] ":"")+'<span class="r" id="th">Theme</span>';document.getElementById("nav").innerHTML=h;if(isAdm())document.getElementById("lo").onclick=function(e){e.preventDefault();SB.auth.signOut().then(function(){location.reload()})};
document.getElementById("th").onclick=function(){var r=document.documentElement,dk=(r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=dk?"light":"dark"}}
function postHTML(p,op,thread,inIndex){var img=p.img?'<img class="th" src="'+p.img+'" alt="" onclick="this.classList.toggle(\'big\')">':"";
return'<div class="post '+(op?"op":"reply")+'" id="p'+p.id+'"><div class="info">'+(op?'<span class="sj">'+esc(thread.subject||"")+"</span> ":"")+'<span class="nm">'+esc(p.adm?"Greg Anderson":p.name)+"</span>"+(p.adm?' <span class="adm">## Admin</span>':"")+" "+dt(p.time)+' <span class="no"><a href="#/'+cur.b+"/"+thread.id+"/"+p.id+'">No.</a><a href="#/'+cur.b+"/"+thread.id+"/"+p.id+'" data-q="'+p.id+'">'+p.id+"</a></span>"+(op&&inIndex?' [<a href="#/'+cur.b+"/"+thread.id+'">Reply</a>]':"")+(isAdm()?' <span class="del" data-del="'+p.id+'">[Delete]</span>':"")+"</div>"+img+'<div class="msg">'+fmt(p.text)+"</div></div>"}
function formHTML(thread){return'<div class="formwrap"><a class="tog" id="tog">['+(thread?"Post a Reply":"Start a New Thread")+']</a><form class="post" id="f"><label><span>Name</span><input type="text" id="fn" maxlength="40" placeholder="Anonymous"></label>'+(thread?"":'<label><span>Subject</span><input type="text" id="fs" maxlength="80"></label>')+'<label><span>Comment</span><textarea id="fc" maxlength="2000"></textarea></label><label><span>File</span><input type="file" id="ff" accept="image/*"></label><div class="row">'+(isAdm()?'<label style="display:inline"><input type="checkbox" id="fa" checked> Post as admin</label>':"")+'<button type="submit">Post</button><span class="err"></span></div></form></div>'}
function wire(thread){var f=document.getElementById("f");document.getElementById("tog").onclick=function(){f.classList.toggle("open")};
f.onsubmit=function(e){e.preventDefault();var txt=document.getElementById("fc").value.trim(),sj=thread?"":document.getElementById("fs").value.trim(),file=document.getElementById("ff").files[0];
if(!txt&&!file)return err("Write a comment or attach an image.");if(!thread&&!txt)return err("A new thread needs a comment.");
function go(img){var r={name:document.getElementById("fn").value.trim()||"Anonymous",body:txt,img:img||null,adm:!!(isAdm()&&document.getElementById("fa")&&document.getElementById("fa").checked),board:cur.b};
var q=thread?SB.from("replies").insert(Object.assign(r,{thread_id:thread.id})):SB.from("threads").insert(Object.assign(r,{subject:sj}));
q.select().single().then(function(x){if(x.error)return err("Could not post: "+x.error.message);f.reset();pull().then(function(){location.hash="#/"+cur.b+"/"+(thread?thread.id+"/":"")+x.data.id})})}
if(!file)return go();if(file.size>4e6)return err("Image must be under 4 MB.");
var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);go(c.toDataURL("image/jpeg",.7))};im.onerror=function(){err("Could not read that image.")};im.src=rd.result};rd.readAsDataURL(file)}}
function route(){var h=location.hash.replace(/^#\/?/,"").split("/"),app=document.getElementById("app");load();nav();cur={b:h[0],t:+h[1]||0,hl:+h[2]||0};document.title="Fukistain";
if(!BOARDS[cur.b]){app.innerHTML='<div class="logo"><h1>Fukistain</h1><p>I\'m not even supposed to be here today</p></div><hr><div class="boards">'+Object.keys(BOARDS).map(function(k){return'<a class="bcard" href="#/'+k+'"><b>/'+k+"/ - "+BOARDS[k][0]+"</b>"+BOARDS[k][1]+" ("+D[k].length+" threads)</a>"}).join("")+'</div><div class="foot">'+NOTE+'</div>';return}
var B=BOARDS[cur.b],L=D[cur.b].slice().sort(function(a,b){return b.bump-a.bump}),head='<div class="logo"><h1>/'+cur.b+"/ - "+B[0]+"</h1><p>"+B[1]+"</p></div><hr>";
if(cur.t){var T=D[cur.b].filter(function(x){return x.id==cur.t})[0];if(!T){app.innerHTML=head+'<p class="crumb">Thread not found. <a href="#/'+cur.b+'">Return</a></p>';return}
document.title="/"+cur.b+"/ - "+(T.subject||"Thread "+T.id)+" - Fukistain";
app.innerHTML=head+'<div class="crumb">[<a href="#/'+cur.b+'">Return</a>] Thread '+T.id+"</div>"+formHTML(T)+"<hr>"+'<div class="thread">'+postHTML(T,1,T)+T.r.map(function(r){return postHTML(r,0,T)}).join("")+"</div><hr>";wire(T);
if(cur.hl){var e=document.getElementById("p"+cur.hl);if(e){e.style.outline="2px solid var(--hover)";e.scrollIntoView({block:"center"})}}}
else{app.innerHTML=head+formHTML()+"<hr>"+(L.length?L.map(function(T){var show=T.r.slice(-3),om=T.r.length-show.length;return'<div class="thread">'+postHTML(T,1,T,1)+(om?'<div class="omit">'+om+" repl"+(om>1?"ies":"y")+" omitted.</div>":"")+show.map(function(r){return postHTML(r,0,T)}).join("")+"</div><hr>"}).join(""):'<p class="crumb" style="text-align:center">No threads yet. Start the first one.</p>');wire()}
}
document.addEventListener("click",function(e){var q=e.target.getAttribute&&e.target.getAttribute("data-q");if(q){var t=document.getElementById("fc");if(t){e.preventDefault();document.getElementById("f").classList.add("open");t.value+=">>"+q+"\n";t.focus()}}});
function login(){document.getElementById("nav").innerHTML="";document.getElementById("app").innerHTML='<div class="logo"><h1>Fukistain</h1><p>I\'m not even supposed to be here today</p></div><hr><p class="crumb" style="text-align:center">Could not connect. Please try again later.</p>'}
var _r=route;route=function(){if(!ME)return login();_r()};
document.addEventListener("click",function(e){var d=e.target.getAttribute&&e.target.getAttribute("data-del");if(!d||!isAdm())return;if(!e.target.dataset.arm){e.target.dataset.arm=1;e.target.textContent="[Confirm?]";return}var id=+d,t=D[cur.b].find(function(t){return t.id==id});(t?SB.from("threads").delete().eq("id",id):SB.from("replies").delete().eq("id",id)).then(function(){if(t&&cur.t==id)location.hash="#/"+cur.b;pull()})});
async function start(ses){ME=ses&&ses.user||null;ADM=false;if(ME){var a=await SB.from("admins").select("user_id").eq("user_id",ME.id);ADM=!!(a.data&&a.data.length);if(!window._ch){window._ch=SB.channel("fk").on("postgres_changes",{event:"*",schema:"public"},pull).subscribe();setInterval(pull,20000)}await pull()}route()}
window.addEventListener("hashchange",function(){route()});
(async function(){if(SUPABASE_URL.indexOf("PASTE")==0){document.getElementById("app").innerHTML='<p class="crumb">Setup needed: add your Supabase URL and key near the top of index.html.</p>';return}
SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var m=location.hash.match(/^#u=([^&]+)&k=(.+)$/);if(m){await SB.auth.signInWithPassword({email:decodeURIComponent(m[1]),password:decodeURIComponent(m[2])});history.replaceState(null,"",location.pathname+location.search+"#/")}
var s=await SB.auth.getSession(),ses=s.data.session;if(!ses){var an=await SB.auth.signInAnonymously();ses=an.data&&an.data.session}await start(ses);
SB.auth.onAuthStateChange(function(ev,ses){if((ev=="SIGNED_IN"&&!ME)||ev=="SIGNED_OUT")start(ses)})})();
</script>
</body>
</html>
